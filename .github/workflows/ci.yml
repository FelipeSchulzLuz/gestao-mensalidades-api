name: CI Pipeline

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # ===================================
  # Job 1: Build e Testes
  # ===================================
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java: [21]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gestao_mensalidades_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: ☕ Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'
      
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 🏗️ Build with Gradle
        run: ./gradlew clean build -x test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
      
      - name: 🧪 Run Tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gestao_mensalidades_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      
      - name: 📊 Generate Test Report
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon
      
      - name: 📈 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/
      
      - name: 📈 Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/
      
      - name: 💾 Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/libs
            build/classes
          key: ${{ runner.os }}-build-${{ github.sha }}

  # ===================================
  # Job 2: Code Quality & Security
  # ===================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 🔍 Dependency Check (OWASP)
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true
      
      - name: 🔒 Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: 📤 Upload Security Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: "📦 Fallback: Upload Trivy SARIF as artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
      
      - name: 📊 SonarCloud Scan (Optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            ./gradlew sonar --no-daemon \
              -Dsonar.projectKey=gestao-mensalidades-api \
              -Dsonar.organization=your-org \
              -Dsonar.host.url=https://sonarcloud.io
          else
            echo "⚠️ SONAR_TOKEN not set, skipping SonarCloud scan"
          fi
        continue-on-error: true

  # ===================================
  # Job 3: Docker Build
  # ===================================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/gestao-mensalidades-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/gestao-mensalidades-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/gestao-mensalidades-api:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ===================================
  # Job 4: Notification
  # ===================================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, docker-build]
    if: always()
    
    steps:
      - name: ✅ Success Notification
        if: needs.build-and-test.result == 'success'
        run: |
          echo "✅ CI Pipeline completed successfully!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
      
      - name: ❌ Failure Notification
        if: needs.build-and-test.result == 'failure'
        run: |
          echo "❌ CI Pipeline failed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          exit 1
