name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master, develop ]

jobs:
  # ===================================
  # Job 1: PR Validation
  # ===================================
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: 📝 Check PR Title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
      
      - name: 📏 Check PR Size
        run: |
          additions=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{sum+=$1} END {print sum}')
          deletions=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{sum+=$2} END {print sum}')
          total=$((additions + deletions))
          
          echo "📊 PR Stats:"
          echo "  Additions: $additions"
          echo "  Deletions: $deletions"
          echo "  Total: $total"
          
          if [ $total -gt 1000 ]; then
            echo "⚠️ Large PR detected ($total lines changed)"
            echo "Consider breaking this into smaller PRs for easier review"
          fi
      
      - name: 🔍 Check for Merge Conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q "^changed in both"; then
            echo "❌ Merge conflicts detected"
            exit 1
          else
            echo "✅ No merge conflicts"
          fi

  # ===================================
  # Job 2: Code Review Automation
  # ===================================
  auto-review:
    needs: validate-pr
    uses: ./.github/workflows/build-and-test.yml
    with: {}

  # Keep a small job to comment with coverage and do light static checks
  auto-review-post:
    name: Post-build Checks
    runs-on: ubuntu-latest
    needs: [auto-review, validate-pr]
    steps:
      - name: � Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔍 Run Checkstyle
        run: ./gradlew checkstyleMain --no-daemon
        continue-on-error: true

      - name: 🔎 SpotBugs Analysis
        run: ./gradlew spotbugsMain --no-daemon
        continue-on-error: true

      - name: 📊 Comment PR with Coverage
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${ { github.workspace } }/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 80
          title: 'Code Coverage Report'
  
  # ===================================
  # Job Y: SonarCloud Quality Gate (PR)
  # ===================================
  sonar-quality-gate:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: auto-review
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ☕ Setup utils
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl || true

      - name: ▶️ Wait for SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: FelipeSchulzLuz_gestao-mensalidades-api
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not set — skipping SonarCloud Quality Gate check"
            exit 0
          fi

          echo "Checking SonarCloud Quality Gate for PR #${PR_NUMBER}..."
          API_URL="https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&pullRequest=${PR_NUMBER}"

          attempts=0
          max_attempts=30
          delay=10

          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts+1))
            echo "Attempt $attempts/$max_attempts: querying SonarCloud..."
            resp=$(curl -s -u ${SONAR_TOKEN}: "$API_URL") || resp=""

            if [ -z "$resp" ]; then
              echo "No response from SonarCloud API yet. Sleeping $delay seconds..."
              sleep $delay
              continue
            fi

            status=$(echo "$resp" | jq -r '.projectStatus.status // "UNKNOWN"')
            echo "SonarCloud projectStatus.status = $status"

            if [ "$status" = "OK" ]; then
              echo "✅ SonarCloud Quality Gate PASSED"
              exit 0
            fi

            if [ "$status" = "ERROR" ]; then
              echo "❌ SonarCloud Quality Gate FAILED"
              echo "Full response:"
              echo "$resp"
              exit 1
            fi

            # if status is NONE or WARN or UNKNOWN or still in progress, wait
            echo "Status is $status — waiting $delay seconds before retrying..."
            sleep $delay
          done

          echo "Timed out waiting for SonarCloud Quality Gate after $max_attempts attempts"
          exit 1

  # ===================================
  # ===================================
  # Job X: Scripts smoke test
  # ===================================
  scripts-smoke:
    name: Scripts Smoke Test
    runs-on: ubuntu-latest
    needs: validate-pr

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: 🔧 Ensure scripts executable
        run: chmod +x scripts/*.sh || true

      - name: 🧪 Toolbox dry-run (merge-env)
        run: |
          # Run dry-run merge to ensure toolbox and merge script are present and runnable
          ./scripts/toolbox.sh merge-env || (echo "Toolbox smoke test failed" && exit 1)

  # ===================================
  # Job 3: Documentation Check
  # ===================================
  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    needs: validate-pr
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: 📚 Check if docs updated
        id: docs_check
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "src/"; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "docs/"; then
              echo "⚠️ Code changes detected but no documentation updates"
              echo "has_docs_warning=true" >> $GITHUB_OUTPUT
            else
              echo "✅ Documentation updated"
              echo "has_docs_warning=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: 💬 Comment PR about docs
        if: steps.docs_check.outputs.has_docs_warning == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Documentation Update Reminder**\n\nCode changes were detected, but no documentation updates were found. Please consider updating the relevant documentation in `docs/` if needed.'
            })
      
      - name: 🔗 Check for broken links in docs
        run: |
          echo "Checking for broken internal links..."
          find docs -name "*.md" -type f -exec grep -H "\[.*\](.*\.md)" {} \; | while read line; do
            file=$(echo $line | cut -d: -f1)
            link=$(echo $line | sed 's/.*(\(.*\.md\)).*/\1/')
            if [[ $link == /* ]]; then
              link="docs$link"
            elif [[ $link != http* ]]; then
              link="$(dirname $file)/$link"
            fi
            if [[ $link != http* ]] && [ ! -f "$link" ]; then
              echo "❌ Broken link in $file: $link"
            fi
          done

  # ===================================
  # Job 4: Security Scan
  # ===================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: validate-pr
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 🔒 OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      
      - name: 📤 Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

  # ===================================
  # Job 5: Build Docker Image (Test)
  # ===================================
  docker-test-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: validate-pr
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build Docker Image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gestao-mensalidades-api:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: ✅ Docker build successful
        run: echo "Docker image built successfully for PR #${{ github.event.number }}"
