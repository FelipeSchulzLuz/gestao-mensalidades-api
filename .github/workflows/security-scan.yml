name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Executar scan de segurança toda segunda às 3h AM
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
  checks: write

jobs:
  # ===================================
  # Job 1: Dependency Vulnerability Scan
  # ===================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 🔍 OWASP Dependency Check
        run: |
          ./gradlew dependencyCheckAnalyze --no-daemon || true
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      
      - name: 📤 Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: build/reports/dependency-check-report.html
      
      - name: 🔒 Gradle Dependency Submission
        uses: mikepenz/gradle-dependency-submission@v1
        with:
          gradle-build-module: |-
            :
          gradle-build-configuration: |-
            runtimeClasspath

  # ===================================
  # Job 2: Code Security Analysis (Trivy)
  # ===================================
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: 🔒 Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
      
      - name: 📤 Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

      - name: "📦 Fallback: Upload Trivy FS SARIF as artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results-sarif
          path: trivy-fs-results.sarif
      
      - name: 📊 Generate Trivy Report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'
      
      - name: 📤 Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

  # ===================================
  # Job 3: Docker Image Security Scan
  # ===================================
  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build Docker Image (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gestao-mensalidades-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🔒 Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gestao-mensalidades-api:scan'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
      
      - name: 📤 Upload Docker Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: 'trivy-docker-image'

      - name: "📦 Fallback: Upload Trivy Docker SARIF as artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-results-sarif
          path: trivy-docker-results.sarif
      
      - name: 🔍 Scan with Docker Scout (if available)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          if docker scout version &> /dev/null; then
            docker scout cves gestao-mensalidades-api:scan --format sarif --output scout-results.sarif || true
            if [ -f scout-results.sarif ]; then
              echo "✅ Docker Scout scan completed"
            fi
          else
            echo "⚠️ Docker Scout not available, skipping"
          fi

  # ===================================
  # Job 4: Secret Scanning
  # ===================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: 🔐 TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Determine sensible base/head depending on event type (push vs pull_request).
          # For pull requests, use the PR base/head SHAs. For push, use github.event.before and github.sha.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --json
        # If TruffleHog finds nothing to scan because base==head (e.g. manual dispatch or empty diff),
        # don't fail the entire workflow - surface results but allow other scans to continue.
        continue-on-error: true

  # ===================================
  # Job 5: CodeQL Analysis
  # ===================================
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended,security-and-quality
      
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 🏗️ Build for CodeQL
        run: ./gradlew clean build -x test --no-daemon
      
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ===================================
  # Job 6: Security Report Summary
  # ===================================
  security-summary:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, trivy-scan, docker-scan, secret-scan, codeql]
    if: always()
    
    steps:
      - name: 📊 Generate Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | ${{ needs.trivy-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Scan | ${{ needs.docker-scan.result == 'success' && '✅ Passed' || needs.docker-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Scan Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
