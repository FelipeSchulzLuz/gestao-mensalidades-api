name: SonarCloud Analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
      
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 📦 Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: 🏗️ Build and Run Tests
        run: ./gradlew clean build test jacocoTestReport --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
      
      - name: 📊 SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar --no-daemon \
            -Dsonar.projectKey=FelipeSchulzLuz_gestao-mensalidades-api \
            -Dsonar.organization=felipeschulzluz \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
            -Dsonar.junit.reportPaths=build/test-results/test \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.exclusions=**/*Test.java,**/*Tests.java,**/test/**,**/build/** \
            -Dsonar.coverage.exclusions=**/*Test.java,**/*Tests.java,**/test/**,**/application/**,**/config/**
      
      - name: ⚠️ SonarCloud Token Not Configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN secret not configured. Skipping SonarCloud analysis."
          echo "To enable SonarCloud:"
          echo "1. Create account at https://sonarcloud.io"
          echo "2. Generate token at https://sonarcloud.io/account/security"
          echo "3. Add SONAR_TOKEN to repository secrets"
          echo "4. Update sonar.projectKey and sonar.organization in this workflow"
      
      - name: 📈 Quality Gate Status
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "✅ SonarCloud analysis completed!"
          echo "📊 View results: https://sonarcloud.io/dashboard?id=FelipeSchulzLuz_gestao-mensalidades-api"
