plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '11.13.3'
	id 'jacoco'
	id 'org.owasp.dependencycheck' version '12.1.6'
	id 'org.sonarqube' version '6.3.1.5724'
}

group = 'br.com.gestaomensalidades'
version = '0.0.1-SNAPSHOT'
description = 'API para o Sistema de Gestão de Mensalidades'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('flywayVersion', '11.13.2')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'  // H2 in-memory database for tests
    // Para a integração com a API do Stripe
    implementation 'com.stripe:stripe-java:30.0.0'
    
    // JWT (autenticação própria)
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    
    // Firebase Admin SDK (autenticação Firebase)
    implementation 'com.google.firebase:firebase-admin:9.7.0'
    
	// Migrations
	implementation "org.flywaydb:flyway-core:${flywayVersion}"
	implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport // Gerar relatório de cobertura após os testes
}

// Configuração do Jacoco para relatórios de cobertura de testes
jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test // Garantir que os testes sejam executados antes
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/config/**',
				'**/dto/**',
				'**/entities/**',
				'**/enums/**',
				'**/*Application.class'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.70 // Cobertura mínima de 70%
			}
		}
	}
}

// Configuração do SonarQube
sonar {
	properties {
		property "sonar.projectName", "Gestão de Mensalidades API"
		property "sonar.projectKey", "FelipeSchulzLuz_gestao-mensalidades-api"
		property "sonar.organization", "felipeschulzluz"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.java.coveragePlugin", "jacoco"
		property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.junit.reportPaths", "build/test-results/test"
		property "sonar.java.binaries", "build/classes/java/main"
		property "sonar.exclusions", "**/*Test.java,**/*Tests.java,**/test/**,**/build/**"
		property "sonar.coverage.exclusions", "**/*Test.java,**/*Tests.java,**/test/**,**/application/**,**/config/**,**/dto/**,**/entities/**,**/enums/**"
		property "sonar.sourceEncoding", "UTF-8"
	}
}

// Configuração do OWASP Dependency Check
dependencyCheck {
	format = 'HTML'
	outputDirectory = file("build/reports")
	suppressionFile = file("owasp-suppressions.xml")
	failBuildOnCVSS = 7.0
	analyzers {
		assemblyEnabled = false
		nuspecEnabled = false
		nodeEnabled = false
	}
}
