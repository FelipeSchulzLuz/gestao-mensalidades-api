# ==================================
# TEST PROFILE CONFIGURATION
# ==================================
spring:
  application:
    name: gestao-mensalidades-api-test
  
  config:
    activate:
      on-profile: test
  
  # H2 In-Memory Database for Tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # Flyway (disabled for tests - using ddl-auto)
  flyway:
    enabled: false
  
  # Redis (disabled for tests or use embedded)
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple  # Simple in-memory cache for tests
  
  # Security Configuration (matching main application.yml structure)
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-only-minimum-256-bits-HS256-required
      expiration: 3600000

# Stripe Configuration (test mode)
stripe:
  api-key: sk_test_fake_key_for_tests
  publishable-key: pk_test_fake_key_for_tests
  webhook-secret: whsec_test_fake_webhook_secret

# Server Configuration
server:
  port: 0  # Random port for tests
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    context-path: /api

# Application Configuration
application:
  frontend:
    url: http://localhost:3000
    success-url: http://localhost:3000/checkout/success
    cancel-url: http://localhost:3000/checkout/cancel
  cors:
    allowed-origins: http://localhost:3000

# Actuator (minimal for tests)
management:
  endpoints:
    enabled-by-default: false

# Logging (minimal for tests)
logging:
  level:
    root: WARN
    br.com.gestaomensalidades: INFO
